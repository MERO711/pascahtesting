<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the six Cordilleran provinces and their cultural heritage archives." />
  <title>Explore the Cordilleran Region | PASCAH</title>
  <link rel="stylesheet" href="map.css" />
</head>
<body>
  <main class="map-page">
    <header class="map-header">
      <p class="eyebrow">PASCAH · DIGITAL MUSEUM</p>
      <h1>Cordilleran Region</h1>
      <p>Select a province to explore its archive.</p>
    </header>

    <section class="map-section" aria-labelledby="province-map-title">
      <h2 id="province-map-title" class="visually-hidden">Interactive map of the Cordilleran provinces</h2>
      <div class="map-frame">
        <a class="province-link province-abra" href="abra-archive.html" aria-label="Open the Abra archive">
          <img src="Cordi%20Map/abra-text.png" alt="Abra" />
        </a>
        <a class="province-link province-apayao" href="apayao-archive.html" aria-label="Open the Apayao archive">
          <img src="Cordi%20Map/apayao-text.png" alt="Apayao" />
        </a>
        <a class="province-link province-benguet" href="benguet-archive.html" aria-label="Open the Benguet archive">
          <img src="Cordi%20Map/benguet-text.png" alt="Benguet" />
        </a>
        <a class="province-link province-ifugao" href="ifugao-archive.html" aria-label="Open the Ifugao archive">
          <img src="Cordi%20Map/ifugao-text.png" alt="Ifugao" />
        </a>
        <a class="province-link province-kalinga" href="kalinga-archive.html" aria-label="Open the Kalinga archive">
          <img src="Cordi%20Map/kalinga-text.png" alt="Kalinga" />
        </a>
        <a class="province-link province-mountain-province" href="mountain-province-archive.html" aria-label="Open the Mountain Province archive">
          <img src="Cordi%20Map/mountain-province-text.png" alt="Mountain Province" />
        </a>

      </div>
      <p class="map-hint">Hover over a province to highlight it, or select it to open its archive.</p>
      <nav class="province-list" aria-label="Province archives">
        <a href="abra-archive.html">Abra</a>
        <a href="apayao-archive.html">Apayao</a>
        <a href="benguet-archive.html">Benguet</a>
        <a href="ifugao-archive.html">Ifugao</a>
        <a href="kalinga-archive.html">Kalinga</a>
        <a href="mountain-province-archive.html">Mountain Province</a>
      </nav>
    </section>
    <footer>PASCAH · Cultural Heritage Archive</footer>
  </main>
</body>
</html>
